<!doctype html>
<html lang="en" data-docs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geospatial Component Library</title>
    <meta
      name="description"
      content="A React component library for interactive geospatial visualisation. Twelve independently installable packages for raster, vector and GPU flow-field rendering, built on MapLibre GL, deck.gl and WeatherLayers GL."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230ea5e9' stroke-width='2.5'/%3E%3Cellipse cx='16' cy='16' rx='6' ry='13' fill='none' stroke='%230ea5e9' stroke-width='2.5'/%3E%3Cpath d='M3 16h26' stroke='%230ea5e9' stroke-width='2.5'/%3E%3C/svg%3E" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        var stored = localStorage.getItem('docs-theme');
        if (stored) document.documentElement.setAttribute('data-docs-theme', stored);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
